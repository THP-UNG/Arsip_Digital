<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ARSIP DIGITAL THP</title>
<meta name="description" content="Arsip Digital THP Universitas Negeri Gorontalo">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ARSIP DIGITAL THP">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="https://lh3.googleusercontent.com/d/1PKxxfVuSnfWPKP6ZNNnb8ewt3TG_3D0U=w512">
<link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1PKxxfVuSnfWPKP6ZNNnb8ewt3TG_3D0U=w512">
<style>
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; font-family: Arial, sans-serif; }
#splash { position: fixed; inset: 0; background: #ffffff; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; transition: opacity .8s ease; }
#splash.hide { opacity: 0; pointer-events: none; }
#splash img { width: 160px; max-width: 40vw; opacity: 0; transform: scale(.85); animation: logoAppear 1.4s ease forwards; }
#splash img.broken { display: none; }
@keyframes logoAppear { 0% { opacity: 0; transform: scale(.85); } 60% { opacity: 1; } 100% { opacity: 1; transform: scale(1); } }
#splash h2 { margin: 22px 0 6px; color: #1f2937; font-size: 24px; font-weight: 700; text-align: center; padding: 0 16px; opacity: 0; animation: textAppear .8s ease forwards; animation-delay: .5s; }
#splash p { margin: 0; color: #6b7280; font-size: 14px; text-align: center; padding: 0 16px; opacity: 0; animation: textAppear .8s ease forwards; animation-delay: .8s; }
@keyframes textAppear { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.loader { width: 220px; max-width: 60vw; height: 4px; margin-top: 30px; background: #f1f5f9; border-radius: 999px; overflow: hidden; }
.loader span { display: block; height: 100%; width: 40%; background: #dc2626; border-radius: 999px; animation: slide 1.3s ease-in-out infinite; }
@keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }

#installBtn { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); padding: 12px 20px; border: none; border-radius: 10px; background: #dc2626; color: #fff; font-size: 15px; font-weight: bold; z-index: 999; display: none; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,.15); }
@media screen and (min-width: 769px) { #installBtn { display: none !important; } }

.iframe-container { width: 100%; height: 100dvh; }
iframe { width: 100%; height: 100%; border: none; }

#errorBox { position: fixed; inset: 0; background: #fff; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 9998; padding: 24px; text-align: center; }
#errorBox h3 { color: #1f2937; margin: 0 0 8px; }
#errorBox p { color: #6b7280; font-size: 14px; margin: 0 0 20px; }
#errorBox button { padding: 10px 24px; border: none; border-radius: 10px; background: #dc2626; color: #fff; font-weight: bold; cursor: pointer; }

/* Tombol "Aktifkan Biometrik" floating (muncul setelah login) */
#bioEnableBtn {
  position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
  padding: 12px 22px; border: none; border-radius: 12px;
  background: linear-gradient(135deg,#4f46e5,#2563eb); color: #fff; font-size: 14px; font-weight: bold;
  z-index: 998; display: none; cursor: pointer; box-shadow: 0 6px 20px rgba(37,99,235,.35);
  align-items: center; gap: 8px;
}
#bioEnableBtn .x { margin-left: 6px; opacity: .7; font-weight: normal; }

/* Overlay login biometrik */
#bioOverlay { position: fixed; inset: 0; background: rgba(255,255,255,.98); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 9997; padding: 24px; text-align: center; }
#bioOverlay .bioIcon { width: 76px; height: 76px; border-radius: 50%; background: linear-gradient(135deg,#4f46e5,#2563eb); display: flex; align-items: center; justify-content: center; margin-bottom: 18px; box-shadow: 0 8px 24px rgba(37,99,235,.3); }
#bioOverlay .bioIcon svg { width: 38px; height: 38px; fill: #fff; }
#bioOverlay h3 { color: #1f2937; margin: 0 0 6px; font-size: 19px; }
#bioOverlay p { color: #6b7280; font-size: 13px; margin: 0 0 24px; max-width: 280px; }
#bioOverlay .bioBtns { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 260px; }
#bioOverlay button { padding: 13px 20px; border: none; border-radius: 12px; font-size: 14px; font-weight: bold; cursor: pointer; }
#bioLoginBtn { background: linear-gradient(135deg,#4f46e5,#2563eb); color: #fff; }
#bioSkipBtn { background: #f1f5f9; color: #475569; }
</style>
</head>
<body>

<div id="splash">
  <img src="https://lh3.googleusercontent.com/d/1PKxxfVuSnfWPKP6ZNNnb8ewt3TG_3D0U=w512" alt="Logo THP" onerror="this.classList.add('broken')">
  <h2>ARSIP DIGITAL THP</h2>
  <p>Universitas Negeri Gorontalo</p>
  <div class="loader"><span></span></div>
</div>

<div id="errorBox">
  <h3>Gagal Memuat Aplikasi</h3>
  <p>Periksa koneksi internet Anda, lalu coba lagi.</p>
  <button onclick="location.reload()">Muat Ulang</button>
</div>

<div id="bioOverlay">
  <div class="bioIcon"><svg viewBox="0 0 24 24"><path d="M12 1C7 1 3 5 3 10v2c0 1 .8 2 2 2h.5c.3 0 .5-.2.5-.5V10c0-3.3 2.7-6 6-6s6 2.7 6 6v3.5c0 .3.2.5.5.5H19c1.2 0 2-1 2-2v-2c0-5-4-9-9-9zm0 6c-1.7 0-3 1.3-3 3v6c0 1.7 1.3 3 3 3s3-1.3 3-3v-6c0-1.7-1.3-3-3-3z"/></svg></div>
  <h3>Login Biometrik</h3>
  <p>Gunakan Face ID atau sidik jari untuk masuk dengan cepat.</p>
  <div class="bioBtns">
    <button id="bioLoginBtn" type="button">🔓 Masuk dengan Biometrik</button>
    <button id="bioSkipBtn" type="button">Login Manual</button>
  </div>
</div>

<button id="bioEnableBtn" type="button">
  <span>🔒 Aktifkan Login Biometrik</span><span class="x" id="bioEnableClose">✕</span>
</button>

<button id="installBtn" type="button">📲 Install Aplikasi</button>

<div class="iframe-container">
  <iframe id="app"
    src="https://script.google.com/macros/s/AKfycbyT-sRKPsh4k-Q2p9U-es2qXqdbSq4bK0teRHOompw6tpXEa_A2ZPGKHlnCkczrGPjcww/exec"
    title="Arsip Digital THP"
    allow="fullscreen; camera; microphone; display-capture; geolocation; clipboard-read; clipboard-write; publickey-credentials-get *; publickey-credentials-create *"
    allowfullscreen>
  </iframe>
</div>

<script>
(function () {
  'use strict';

  var splash      = document.getElementById('splash');
  var iframe      = document.getElementById('app');
  var installBtn  = document.getElementById('installBtn');
  var errorBox    = document.getElementById('errorBox');
  var bioOverlay  = document.getElementById('bioOverlay');
  var bioLoginBtn = document.getElementById('bioLoginBtn');
  var bioSkipBtn  = document.getElementById('bioSkipBtn');
  var bioEnableBtn = document.getElementById('bioEnableBtn');
  var bioEnableClose = document.getElementById('bioEnableClose');

  var isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  var APP_ORIGIN = 'https://script.google.com';
  // Origin yang valid untuk pesan dari aplikasi GAS (konten di-render dari beberapa domain Google)
  var ORIGIN_VALID = [
    'https://script.google.com',
    'https://script.googleusercontent.com',
    'https://n-xxxxxx.googleusercontent.com' // pola subdomain dinamis GAS
  ];
  function originValid(origin) {
    if (!origin) return false;
    return origin.indexOf('script.google.com') !== -1 ||
           origin.indexOf('googleusercontent.com') !== -1;
  }

  function isInstalled() {
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  }

  /* ── Penyimpanan biometrik ── */
  var BIO_CRED_KEY = '_thp_bio_cred', BIO_TOKEN_KEY = '_thp_bio_token', BIO_USER_KEY = '_thp_bio_user';

  // token sementara dari aplikasi (menunggu user klik "Aktifkan")
  var pendingToken = '', pendingUser = '';

  function devKey() {
    var k = localStorage.getItem('_thp_dev_key');
    if (!k) { var a = new Uint8Array(16); crypto.getRandomValues(a); k = Array.from(a).map(function(b){return b.toString(16).padStart(2,'0');}).join(''); localStorage.setItem('_thp_dev_key', k); }
    return k;
  }
  function enc(t) { var key = devKey(), o = ''; for (var i=0;i<t.length;i++) o += String.fromCharCode(t.charCodeAt(i)^key.charCodeAt(i%key.length)); return btoa(o); }
  function dec(b) { try { var key=devKey(), s=atob(b), o=''; for(var i=0;i<s.length;i++) o+=String.fromCharCode(s.charCodeAt(i)^key.charCodeAt(i%key.length)); return o; } catch(e){ return ''; } }
  function b64ToBuf(b){ var s=atob(b.replace(/-/g,'+').replace(/_/g,'/')), u=new Uint8Array(s.length); for(var i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u.buffer; }
  function bufToB64(buf){ var b=new Uint8Array(buf), s=''; for(var i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }

  function bioSupported(){ return !!(window.PublicKeyCredential && navigator.credentials); }
  // Cek apakah platform authenticator (Face ID/sidik jari) tersedia
  function bioPlatformReady(){
    if (!bioSupported() || !window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable) {
      return Promise.resolve(false);
    }
    return window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().catch(function(){ return false; });
  }
  function bioTerdaftar(){ return !!localStorage.getItem(BIO_CRED_KEY) && !!localStorage.getItem(BIO_TOKEN_KEY); }

  var lastAppOrigin = APP_ORIGIN;
  function kirimKeApp(msg){
    try { iframe.contentWindow.postMessage(msg, lastAppOrigin); } catch(e){}
    // fallback: kirim juga ke script.google.com utama
    if (lastAppOrigin !== APP_ORIGIN) {
      try { iframe.contentWindow.postMessage(msg, APP_ORIGIN); } catch(e){}
    }
  }

  /* ── Pendaftaran: dipicu oleh KLIK LANGSUNG di wrapper (user gesture valid) ── */
  function daftarkanBiometrik() {
    if (!bioSupported()) { alert('Perangkat tidak mendukung biometrik.'); return; }
    if (!pendingToken) { alert('Silakan login terlebih dahulu.'); return; }
    var challenge = new Uint8Array(32); crypto.getRandomValues(challenge);
    var userId = new Uint8Array(16); crypto.getRandomValues(userId);
    navigator.credentials.create({
      publicKey: {
        challenge: challenge,
        rp: { name: 'ARSIP DIGITAL THP' },
        user: { id: userId, name: pendingUser || 'user', displayName: pendingUser || 'user' },
        pubKeyCredParams: [{ type:'public-key', alg:-7 }, { type:'public-key', alg:-257 }],
        authenticatorSelection: { authenticatorAttachment:'platform', userVerification:'required', residentKey:'preferred' },
        timeout: 60000, attestation: 'none'
      }
    }).then(function (cred) {
      localStorage.setItem(BIO_CRED_KEY, bufToB64(cred.rawId));
      localStorage.setItem(BIO_TOKEN_KEY, enc(pendingToken));
      localStorage.setItem(BIO_USER_KEY, pendingUser || 'user');
      bioEnableBtn.style.display = 'none';
      kirimKeApp({ type: 'BIOMETRIK_TERDAFTAR', ok: true });
      alert('Login biometrik berhasil diaktifkan!');
    }).catch(function (err) {
      var pesan = err.message || 'coba lagi';
      if (err && err.name === 'NotAllowedError') {
        pesan = 'Pendaftaran dibatalkan atau diblokir browser. Pastikan Face ID/sidik jari aktif di perangkat dan coba lagi.';
      } else if (err && err.name === 'SecurityError') {
        pesan = 'Diblokir keamanan browser (iframe). Fitur biometrik mungkin tidak didukung di konfigurasi ini.';
      } else if (err && err.name === 'NotSupportedError') {
        pesan = 'Perangkat tidak memiliki sensor biometrik yang terdaftar.';
      }
      alert('Biometrik gagal: ' + pesan);
      kirimKeApp({ type: 'BIOMETRIK_TERDAFTAR', ok: false, error: err.message });
    });
  }

  /* ── Login: dipicu oleh KLIK LANGSUNG di overlay (user gesture valid) ── */
  function loginBiometrik() {
    if (!bioTerdaftar()) return;
    var challenge = new Uint8Array(32); crypto.getRandomValues(challenge);
    navigator.credentials.get({
      publicKey: {
        challenge: challenge,
        allowCredentials: [{ type:'public-key', id:b64ToBuf(localStorage.getItem(BIO_CRED_KEY)), transports:['internal'] }],
        userVerification: 'required', timeout: 60000
      }
    }).then(function () {
      bioOverlay.style.display = 'none';
      var token = dec(localStorage.getItem(BIO_TOKEN_KEY));
      kirimKeApp({ type: 'AUTO_LOGIN', token: token, username: localStorage.getItem(BIO_USER_KEY) || '' });
    }).catch(function (err) {
      if (err && err.name !== 'NotAllowedError') alert('Login biometrik gagal: ' + (err.message || 'coba lagi'));
    });
  }

  function hapusBiometrik() {
    localStorage.removeItem(BIO_CRED_KEY);
    localStorage.removeItem(BIO_TOKEN_KEY);
    localStorage.removeItem(BIO_USER_KEY);
  }

  /* Tombol biometrik = KLIK LANGSUNG (inilah kunci agar WebAuthn tidak diblokir) */
  if (bioEnableBtn) bioEnableBtn.addEventListener('click', function (e) {
    if (e.target === bioEnableClose) { bioEnableBtn.style.display = 'none'; return; }
    daftarkanBiometrik();
  });
  if (bioLoginBtn) bioLoginBtn.addEventListener('click', loginBiometrik);
  if (bioSkipBtn)  bioSkipBtn.addEventListener('click', function(){ bioOverlay.style.display = 'none'; });

  /* ── Terima pesan dari aplikasi (iframe) ── */
  window.addEventListener('message', function (event) {
    if (!originValid(event.origin)) return;
    lastAppOrigin = event.origin; // ingat origin untuk balasan
    var data = event.data;
    if (!data || typeof data !== 'object') return;

    switch (data.type) {
      // Aplikasi login sukses → simpan token sementara & tampilkan tombol "Aktifkan"
      case 'LOGIN_SUKSES':
        pendingToken = data.token || '';
        pendingUser  = data.username || '';
        if (bioTerdaftar() && pendingToken) localStorage.setItem(BIO_TOKEN_KEY, enc(pendingToken));
        // Tawarkan aktifkan jika platform biometrik tersedia & belum terdaftar
        if (!bioTerdaftar() && pendingToken) {
          bioPlatformReady().then(function(ready){
            if (ready) {
              bioEnableBtn.style.display = 'flex';
            }
          });
        }
        break;

      // Aplikasi minta status biometrik
      case 'CEK_BIOMETRIK':
        kirimKeApp({ type: 'STATUS_BIOMETRIK', supported: bioSupported(), terdaftar: bioTerdaftar() });
        break;

      // Aplikasi minta hapus biometrik
      case 'HAPUS_BIOMETRIK':
        hapusBiometrik();
        bioEnableBtn.style.display = 'none';
        kirimKeApp({ type: 'BIOMETRIK_DIHAPUS', ok: true });
        break;
    }
  });

  /* Tampilkan overlay login biometrik saat buka app (jika terdaftar) */
  function mungkinTampilkanBioLogin() {
    if (bioSupported() && bioTerdaftar()) {
      setTimeout(function () { bioOverlay.style.display = 'flex'; }, 1400);
    }
  }

  /* ── Splash ── */
  var splashHidden = false;
  function hideSplash() {
    if (splashHidden || !splash) return;
    splashHidden = true;
    splash.classList.add('hide');
    setTimeout(function () { if (splash && splash.parentNode) splash.remove(); }, 800);
    mungkinTampilkanBioLogin();
  }
  iframe.addEventListener('load', function () { setTimeout(hideSplash, 1200); });
  var loadTimeout = setTimeout(function () { if (!splashHidden && errorBox) errorBox.style.display = 'flex'; }, 15000);
  iframe.addEventListener('load', function () { clearTimeout(loadTimeout); });
  setTimeout(hideSplash, 8000);

  /* ── Service Worker ── */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function (err) { console.warn('SW failed:', err); });
    });
  }

  /* ── Install ── */
  if (!isMobile && installBtn) { installBtn.remove(); installBtn = null; }
  var deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    if (!isMobile || isInstalled() || !installBtn) return;
    e.preventDefault(); deferredPrompt = e; installBtn.style.display = 'block';
  });
  if (installBtn) installBtn.addEventListener('click', function () {
    if (!deferredPrompt) return;
    installBtn.style.display = 'none';
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function () { deferredPrompt = null; });
  });
  window.addEventListener('appinstalled', function () {
    if (installBtn) installBtn.style.display = 'none';
    deferredPrompt = null;
  });
})();
</script>
</body>
</html>
