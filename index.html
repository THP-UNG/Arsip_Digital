  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
    }

    /* Splash screen saat iframe loading */
    #splash {
      position: fixed;
      inset: 0;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
      transition: opacity 0.4s ease;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    #splash img {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    #splash p {
      color: #64748b;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      letter-spacing: 0.05em;
    }
    #splash .dot-loader {
      display: flex;
      gap: 6px;
    }
    #splash .dot-loader span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6366f1;
      animation: bounce 1.2s infinite ease-in-out;
    }
    #splash .dot-loader span:nth-child(2) { animation-delay: 0.2s; }
    #splash .dot-loader span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.7); opacity: 0.5; }
      40% { transform: scale(1.1); opacity: 1; }
    }

    .iframe-wrap {
      width: 100%;
      height: 100dvh;
      height: 100vh; /* fallback */
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
    }
  </style>
</head>
