<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ARSIP DIGITAL THP</title>

<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ARSIP DIGITAL THP">

<link rel="icon"
href="https://lh3.googleusercontent.com/d/1PKxxfVuSnfWPKP6ZNNnb8ewt3TG_3D0U=w512">

<link rel="apple-touch-icon"
href="https://lh3.googleusercontent.com/d/1PKxxfVuSnfWPKP6ZNNnb8ewt3TG_3D0U=w512">

<style>
html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

/* Splash Screen */
#splash{
    position:fixed;
    inset:0;
    background:#ffffff;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:9999;
    transition:opacity .6s ease;
}

#splash.hide{
    opacity:0;
    pointer-events:none;
}

/* Logo Zoom Animation */
#splash img{
    width:180px;
    max-width:45vw;
    animation:zoomLogo 1.5s ease forwards;
}

@keyframes zoomLogo{
    0%{
        transform:scale(.5);
        opacity:0;
    }
    100%{
        transform:scale(1);
        opacity:1;
    }
}

#splash h2{
    margin:20px 0 8px;
    color:#222;
    font-size:24px;
    font-weight:700;
    letter-spacing:.5px;
}

#splash p{
    margin:0;
    color:#666;
    font-size:14px;
}

/* Iframe */
.iframe-container{
    width:100%;
    height:100dvh;
}

iframe{
    display:block;
    width:100%;
    height:100%;
    border:none;
}
</style>
</head>

<body>

<!-- Splash -->
<div id="splash">
    <img src="https://lh3.googleusercontent.com/d/1PKxxfVuSnfWPKP6ZNNnb8ewt3TG_3D0U=w512"
         alt="Logo THP">

    <h2>ARSIP DIGITAL THP</h2>
    <p>Universitas Negeri Gorontalo</p>
</div>

<!-- App -->
<div class="iframe-container">
    <iframe
        id="app"
        src="https://script.google.com/a/macros/ung.ac.id/s/AKfycbwgSQNgXoCdhYxKBdfp4qiJtUmp3b4recBfa35h6oopaDMXMNF-svOGcmGWm6nFXsT7tA/exec"
        scrolling="yes"
        allowfullscreen="true"
        webkitallowfullscreen="true"
        mozallowfullscreen="true"
        allow="fullscreen; camera; microphone; display-capture; geolocation;">
    </iframe>
</div>

<script>
const splash = document.getElementById('splash');
const iframe = document.getElementById('app');

/* Hilangkan splash saat iframe selesai dimuat */
iframe.addEventListener('load', () => {
    setTimeout(() => {
        splash.classList.add('hide');

        setTimeout(() => {
            splash.remove();
        }, 600);

    }, 500);
});

/* Fallback jika iframe lambat */
setTimeout(() => {
    if(document.getElementById('splash')){
        splash.classList.add('hide');

        setTimeout(() => {
            if(document.getElementById('splash')){
                splash.remove();
            }
        }, 600);
    }
}, 5000);
</script>

</body>
</html>
