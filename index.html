<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ARSIP DIGITAL THP</title>

<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ARSIP DIGITAL THP">

<link rel="manifest" href="manifest.json">

<link rel="icon"
href="https://lh3.googleusercontent.com/d/1PKxxfVuSnfWPKP6ZNNnb8ewt3TG_3D0U=w512">

<link rel="apple-touch-icon"
href="https://lh3.googleusercontent.com/d/1PKxxfVuSnfWPKP6ZNNnb8ewt3TG_3D0U=w512">

<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#fff;
  font-family:Arial,sans-serif;
}

/* SPLASH */

#splash{
    position:fixed;
    inset:0;
    background:#ffffff;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:9999;
    transition:opacity .8s ease;
}

#splash.hide{
    opacity:0;
    pointer-events:none;
}

/* LOGO */

#splash img{
    width:160px;
    max-width:40vw;
    opacity:0;
    transform:scale(.85);
    animation:logoAppear 1.4s ease forwards;
}

@keyframes logoAppear{
    0%{
        opacity:0;
        transform:scale(.85);
    }

    60%{
        opacity:1;
    }

    100%{
        opacity:1;
        transform:scale(1);
    }
}

/* JUDUL */

#splash h2{
    margin:22px 0 6px;
    color:#1f2937;
    font-size:24px;
    font-weight:700;
    letter-spacing:.3px;

    opacity:0;
    animation:textAppear .8s ease forwards;
    animation-delay:.5s;
}

#splash p{
    margin:0;
    color:#6b7280;
    font-size:14px;

    opacity:0;
    animation:textAppear .8s ease forwards;
    animation-delay:.8s;
}

@keyframes textAppear{
    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* LOADING BAR */

.loader{
    width:220px;
    height:4px;
    margin-top:30px;
    background:#f1f5f9;
    border-radius:999px;
    overflow:hidden;
}

.loader span{
    display:block;
    height:100%;
    width:40%;
    background:#dc2626;
    border-radius:999px;

    animation:slide 1.3s ease-in-out infinite;
}

@keyframes slide{
    0%{
        transform:translateX(-100%);
    }

    100%{
        transform:translateX(350%);
    }
}

/* Desktop dan Laptop */
@media screen and (min-width: 769px){
    #installBtn{
        display:none !important;
    }
}

/* INSTALL BUTTON */
#installBtn{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  padding:12px 20px;
  border:none;
  border-radius:10px;
  background:#dc2626;
  color:#fff;
  font-size:15px;
  font-weight:bold;
  z-index:999;
  display:none;
  box-shadow:0 4px 15px rgba(0,0,0,.15);
}

.iframe-container{
  width:100%;
  height:100dvh;
}

iframe{
  width:100%;
  height:100%;
  border:none;
}
</style>
</head>
<body>

<div id="splash">
  <img src="https://lh3.googleusercontent.com/d/1PKxxfVuSnfWPKP6ZNNnb8ewt3TG_3D0U=w512">

  <h2>ARSIP DIGITAL THP</h2>
  <p>Universitas Negeri Gorontalo</p>

  <div class="loader">
    <span></span>
  </div>
</div>

<button id="installBtn">
📲 Install Aplikasi
</button>

<div class="iframe-container">
  <iframe
    id="app"
    src="https://script.google.com/macros/s/AKfycbwgSQNgXoCdhYxKBdfp4qiJtUmp3b4recBfa35h6oopaDMXMNF-svOGcmGWm6nFXsT7tA/exec"
    allow="fullscreen; camera; microphone; display-capture; geolocation;"
    allowfullscreen>
  </iframe>
</div>

<script>
const splash = document.getElementById('splash');
const iframe = document.getElementById('app');

iframe.addEventListener('load', () => {

    setTimeout(() => {

        splash.classList.add('hide');

        setTimeout(() => {
            splash.remove();
        }, 800);

    }, 1200);

});

/* Register Service Worker */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js');
}

/* Install App */
let deferredPrompt;

window.addEventListener('beforeinstallprompt',(e)=>{

    // Desktop/Laptop
    if (window.innerWidth > 768) return;

    // Bukan HP
    const isMobile =
      /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

    if (!isMobile) return;

    // Jika sudah terinstall
    const installed =
      window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone === true;

    if (installed) return;

    e.preventDefault();

    deferredPrompt = e;

    document.getElementById('installBtn').style.display = 'block';
});
</script>

</body>
</html>
