<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ARSIP DIGITAL THP</title>

<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ARSIP DIGITAL THP">

<link rel="icon"
href="https://lh3.googleusercontent.com/d/1PKxxfVuSnfWPKP6ZNNnb8ewt3TG_3D0U=w512">

<link rel="apple-touch-icon"
href="https://lh3.googleusercontent.com/d/1PKxxfVuSnfWPKP6ZNNnb8ewt3TG_3D0U=w512">

<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#fff;
}

#splash{
  position:fixed;
  inset:0;
  background:#ffffff;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

#splash img{
  width:170px;
  max-width:45vw;
}

#splash h2{
  margin:18px 0 0;
  color:#333;
  font-family:Arial,sans-serif;
  font-size:22px;
  font-weight:700;
}

#splash p{
  margin:8px 0 0;
  color:#666;
  font-family:Arial,sans-serif;
}

.hide{
  opacity:0;
  pointer-events:none;
  transition:.5s;
}

.iframe-container{
  width:100%;
  height:100dvh;
}

iframe{
  width:100%;
  height:100%;
  border:none;
}
</style>
</head>

<body>

<div id="splash">
  <img src="https://lh3.googleusercontent.com/d/1PKxxfVuSnfWPKP6ZNNnb8ewt3TG_3D0U=w512">
  <h2>ARSIP DIGITAL THP</h2>
  <p>Universitas Negeri Gorontalo</p>
</div>

<div class="iframe-container">
  <iframe
    id="app"
    src="https://script.google.com/macros/s/AKfycbwgSQNgXoCdhYxKBdfp4qiJtUmp3b4recBfa35h6oopaDMXMNF-svOGcmGWm6nFXsT7tA/exec"
    allow="fullscreen; camera; microphone; display-capture; geolocation;"
    allowfullscreen>
  </iframe>
</div>

<script>
window.addEventListener('load',()=>{
  setTimeout(()=>{
    document.getElementById('splash').classList.add('hide');
  },1500);
});
</script>

</body>
</html>
